name: Reference checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:schema
  intake:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTAKE_TEST_ADMIN_URL: postgresql://postgres:isolated-ci-admin@localhost:5432/postgres
      INTAKE_TEST_DATABASE_URL: postgresql://intake_runtime:isolated-ci-runtime@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r intake/requirements.txt
      - name: Migrate isolated test database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ['INTAKE_TEST_ADMIN_URL'],autocommit=True) as db:
              db.execute(Path('intake/migration.sql').read_text())
              db.execute("ALTER ROLE intake_runtime PASSWORD 'isolated-ci-runtime'")
          PY
      - run: python -m unittest discover -s tests -p test_online_intake.py
      - run: docker build -f intake/Dockerfile -t bamboo-intake .
